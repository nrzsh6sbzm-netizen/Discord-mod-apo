name: Build Discord Mod

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cai dat cong cu
        run: |
          brew install ldid dpkg
          git clone https://github.com/Al4ise/Azule ~/Azule
          sudo ln -sf ~/Azule/azule /usr/local/bin/azule

      - name: Lay IPA Discord tu Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern "*.ipa"
          FILE=$(ls *.ipa | head -n 1)
          mv "$FILE" discord.ipa
          ls -lh discord.ipa

      - name: Lay Tweak dylib on dinh
        run: |
          # Tai tweak tu kho archive luu tru on dinh
          wget -O tweak.dylib "https://raw.githubusercontent.com/swaggyP36000/TrollStore-IPAs/main/files/enmity.dylib" || \
          curl -L -o tweak.dylib "https://raw.githubusercontent.com/swaggyP36000/TrollStore-IPAs/main/files/enmity.dylib"
          ls -lh tweak.dylib

      - name: Tiem Tweak vao Discord
        run: |
          azule -i discord.ipa -o output -f tweak.dylib -m
          ls -lh output/

      - name: Xuat file Discord Mod
        uses: actions/upload-artifact@v4
        with:
          name: DiscordMod-IPA
          path: output/*.ipa
