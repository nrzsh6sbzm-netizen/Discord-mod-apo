name: Build Discord Mod

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Cai dat Azule va Cong cu ho tro
        run: |
          brew install ldid dpkg
          git clone https://github.com/Al4ise/Azule ~/Azule
          sudo ln -sf ~/Azule/azule /usr/local/bin/azule

      - name: Tu dong tai IPA va Mod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Tu dong tim va lay file .ipa trong Release cua ban (Khong lo sai link)
          gh release download --repo ${{ github.repository }} --pattern "*.ipa"
          mv *.ipa discord.ipa
          
          # 2. Tai file dylib cua Revenge (ban thay the hoat dong tot nhat cho Vendetta)
          curl -f -L -o tweak.dylib "https://github.com/revenge-mod/Revenge/releases/latest/download/Revenge.dylib"

      - name: Tiem Tweak vao Discord
        run: |
          azule -i discord.ipa -o output -f tweak.dylib -m

      - name: Xuat file Discord Mod
        uses: actions/upload-artifact@v4
        with:
          name: DiscordMod-IPA
          path: output/*.ipa
